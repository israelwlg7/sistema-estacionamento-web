{% extends 'base.html' %}
{% block title %}Assistente — Vaga Conectada{% endblock %}
{% block page_title %}Assistente Virtual{% endblock %}

{% block content %}
<div class="chat reveal">
  <div class="chat-head">
    <div class="ava"><i class="fas fa-robot"></i></div>
    <div><b>Vaguinha</b><small>Assistente do estacionamento · online</small></div>
  </div>
  
  <div class="chat-log" id="chatLog"></div>
  
  <div class="chips" id="chips"></div>
  
  <!-- CORREÇÃO AQUI: O formulário agora tem o id correto e o botão tem type="submit" -->
  <form class="chat-input" id="chatForm">
    <input id="chatInput" type="text" maxlength="200" placeholder="Pergunte algo… ex: quantas vagas livres?" autocomplete="off">
    <button type="submit" aria-label="Enviar"><i class="fas fa-paper-plane"></i></button>
  </form>
</div>
{% endblock %}

{% block extra_js %}{% load static %}<script src="{% static 'js/bot.js' %}?v=10"></script>{% endblock %}
